name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Test repository validator
        run: python -B -m unittest discover -s tests -p 'test_validate_repo.py' -v

  tests:
    name: Setup tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Run Pi extension tests
        run: node --test tests/test_ask_user_question.ts tests/test_pi_statusline.ts
      - name: Check shell syntax
        run: |
          bash -n scripts/setup.sh && sh -n scripts/setup.sh
          bash -n mods/mermaid-render/scripts/install-renderer.sh
          sh -n mods/mermaid-render/scripts/install-renderer.sh
      - name: Check whitespace
        run: git diff-tree --check --no-commit-id -r HEAD
      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: shellcheck scripts/setup.sh mods/*/scripts/*.sh mods/*/tests/*.sh

  windows:
    name: Native Windows junction tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Run native junction tests
        run: python -B -m unittest discover -s tests -p 'test_windows_setup.py' -v

  mods:
    name: Mod tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup.sh reads the Claude Code catalogs and merges the hooks with Python.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      # The mod API is early access; a version bump is a deliberate change.
      - name: Install Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.311
      - name: Validate and test every mod
        run: |
          for mod in mods/*/; do
            claude plugin validate "$mod"
            claude plugin test "$mod"
          done
      - name: Validate the root plugin
        run: claude plugin validate .
      # The real setup.sh with the real claude command, in a new home directory.
      # The uninstall part checks that setup.sh finds its own catalog, which on
      # Windows has a path form that only the real command gives.
      - name: Install and uninstall the plugin with setup.sh
        run: |
          home="$(mktemp -d)"
          if command -v cygpath >/dev/null 2>&1; then home="$(cygpath -m "$home")"; fi
          export HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude"
          mkdir "$CLAUDE_CONFIG_DIR"
          bash scripts/setup.sh
          plugins="$(claude plugin list --json)"
          printf '%s\n' "$plugins"
          printf '%s\n' "$plugins" | grep -F '"id": "hb@harrison-blair"'
          printf '%s\n' "$plugins" | grep -F '"id": "mermaid-render@harrison-blair"'
          bash scripts/setup.sh --uninstall
          left="$(claude plugin list --json)"
          catalogs="$(claude plugin marketplace list --json)"
          printf '%s\n' "$left" "$catalogs"
          case "$left $catalogs" in *harrison-blair*) exit 1 ;; esac

  mermaid-smoke:
    name: Mermaid renderer smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The mod runs this script, with sh, at the first diagram of a session.
      - name: Install the renderer
        run: sh mods/mermaid-render/scripts/install-renderer.sh
      - name: Render with mermaid-ascii
        run: bash mods/mermaid-render/tests/smoke.sh
